spring:
    datasource:
        url: ${DB_URL}
        driver-class-name: org.postgresql.Driver
        username: ${DB_USER}
        password: ${DB_PASSWORD}
    jpa:
        hibernate:
            ddl-auto: validate
    profiles:
        active: ${PROFILE:development}
    web:
        error:
            include-message: always

server:
    servlet:
        context-path: /

logging:
    level:
        org:
            springframework:
                web: ${LOG_LEVEL:error}
            hibernate:
                sql: ${LOG_LEVEL:error}