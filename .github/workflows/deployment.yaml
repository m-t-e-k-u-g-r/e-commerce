name: Deployment
on:
  push:
    tags:
      - "*.*.*"
    paths:
      - "frontend/**"
      - "backend/**"
env:
  FRONTEND_IMAGE: ghcr.io/m-t-e-k-u-g-r/e-commerce-frontend
  BACKEND_IMAGE: ghcr.io/m-t-e-k-u-g-r/e-commerce-backend
jobs:
  check-changes:
    name: Check if frontend or backend changed
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.check-changes.outputs.frontend }}
      backend: ${{ steps.check-changes.outputs.backend }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check what changed
        uses: dorny/paths-filter@v2
        id: check-changes
        with:
          filters: |
            frontend:
              - 'frontend/**'
            backend:
              - 'backend/**'

  deploy-frontend:
    name: Deploy frontend
    needs: check-changes
    if: ${{ needs.check-changes.outputs.frontend }}
    runs-on: ubuntu-latest
    environment: env
    steps:
      - uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        run: |
          echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io \
            -u ${{ github.actor }} \
            --password-stdin

      - name: Build and push frontend
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ github.ref_name }}
            ${{ env.FRONTEND_IMAGE }}:latest

  deploy-backend:
    name: Deploy backend
    needs: check-changes
    if: ${{ needs.check-changes.outputs.backend }}
    runs-on: ubuntu-latest
    environment: env
    steps:
      - uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        run: |
          echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io \
            -u ${{ github.actor }} \
            --password-stdin

      - name: Build and push backend
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.ref_name }}
            ${{ env.BACKEND_IMAGE }}:latest